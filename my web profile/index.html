<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของ T3RUT0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
            background: linear-gradient(135deg, #000000, #16114b 55%, #250164);
            color: #1f2937;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #312e81;
        }

        p {
            margin-bottom: 24px;
            color: #6b7280;
        }

        ul {
            list-style: none;
            text-align: left;
        }

        li {
            padding: 14px 16px;
            margin-bottom: 10px;
            background: #eef2ff;
            border-left: 4px solid #6366f1;
            border-radius: 8px;
        }

        li:last-child {
            margin-bottom: 0;
        }

        li strong {
            color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">my web profile/images.png</div>
        <h1>สวัสดีครับ/ค่ะ</h1>
        <p>นี่คือเว็บโปรไฟล์ของฉันบน GitHub</p>
        <ul>
            <li><strong>ชื่อเล่น:</strong> T3RUT0</li>
            <li><strong>สิ่งที่กำลังเรียน:</strong> GitHub Desktop</li>
        </ul>
    </div>
</body>
</html>
